<!DOCTYPE html>
<html lang="es">
<head>

  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de artículos deportivos</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Font Awesome (íconos opcionales) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Swiper CSS (slider, si lo usas) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

  <!-- Tu CSS personalizado -->
  <link rel="stylesheet" href="styles.css" />
</head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de artículos deportivos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- jQuery (si lo necesitas) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Swiper JS (si usas sliders) -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- Chart.js (si usas gráficas) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Tu JavaScript personalizado -->
  <script src="script.js"></script>
</body>

  <header>
    <h1>Tienda de artículos deportivos</h1>
  </header>

  <section class="productos">
    <div class="producto">
      <img src="https://via.placeholder.com/150" alt="Producto 1">
      <h3>Balón de fútbol</h3>
      <p>Excelente calidad y durabilidad.</p>
      <p class="precio">€25.00</p>
    </div>
    <div class="producto">
      <img src="https://via.placeholder.com/150" alt="Producto 2">
      <h3>Mancuernas</h3>
      <p>Perfectas para entrenamiento en casa.</p>
      <p class="precio">€40.00</p>
    </div>
    <!-- Puedes duplicar este bloque para más productos -->
  </section>

  <section class="formulario">
    <h2>Contáctanos</h2>
    <form id="contactoForm">
      <input type="text" name="nombre" placeholder="Tu nombre" required />
      <input type="email" name="correo" placeholder="Tu correo electrónico" required />
      <button type="submit">Enviar</button>
    </form>
  </section>

  <footer>
    <p>Tienda de artículos deportivos © Todos los derechos reservados</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
