<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de artículos deportivos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    header {
      background: #007BFF;
      color: white;
      padding: 1em;
      text-align: center;
      width: 100%;
    }

    .productos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 2em;
      gap: 1.5em;
    }

    .producto {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 1em;
      width: 200px;
      text-align: center;
    }

    .producto img {
      width: 100%;
      border-radius: 8px;
    }

    .precio {
      font-weight: bold;
      color: #28a745;
    }

    .formulario {
      background: white;
      padding: 2em;
      margin: 2em;
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .formulario form {
      display: flex;
      flex-direction: column;
      gap: 1em;
    }

    input,
    button {
      padding: 0.8em;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background-color: #007BFF;
      color: white;
      cursor: pointer;
      border: none;
    }

    footer {
      text-align: center;
      background: #222;
      color: white;
      padding: 1em 0;
      margin-top: 2em;
      width: 100%;
    }

    .video {
      text-align: center;
      padding: 2em;
      background: white;
      margin: 2em auto;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .video-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 1em;
    }

    .video-container video {
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Bienvenido a la Tienda de artículos deportivos</h1>
  </header>

  <main>
    <section class="productos">
      <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto ejemplo" />
        <h3>Balón de fútbol</h3>
        <p class="precio">25 €</p>
      </div>
    </section>

    <section class="formulario">
      <form>
        <input type="text" placeholder="Nombre" required />
        <input type="email" placeholder="Correo electrónico" required />
        <button type="submit">Enviar</button>
      </form>
    </section>


<section class="video">
  <h2>Video Promocional</h2>
  <div class="video-container">
    <video width="640" height="360" autoplay loop muted playsinline>
      <source src="https://raw.githubusercontent.com/ivanius05/ivanius05.github.io/main/videos/video.mp4" type="video/mp4">
      Tu navegador no soporta el elemento de video.
    </video>
  </div>
</section>
          

  <footer>
    Tienda de artículos deportivos © Todos los derechos reservados
  </footer>
</body>
</html>
